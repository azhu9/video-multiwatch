<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multiwatch</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header id="toolbar">
      <h1>Multiwatch</h1>
      <span class="hint">To track a tab: switch to it, then click the Multiwatch toolbar icon or right-click the page and choose "Track this tab in Multiwatch."</span>
      <label id="thumb-layout-control">
        Thumbnails:
        <select id="thumb-layout-select">
          <option value="below">Below</option>
          <option value="overlay-bottom">Overlay bottom</option>
          <option value="overlay-left">Overlay left</option>
        </select>
      </label>
      <label id="thumb-quality-control">
        Thumbnail quality:
        <select id="thumb-quality-select">
          <option value="low">Low (default, lightest load)</option>
          <option value="medium">Medium</option>
          <option value="high">High (smoothest, heaviest load)</option>
        </select>
      </label>
    </header>

    <div id="stage">
      <main id="main-stage"></main>
      <section id="thumb-strip"></section>
    </div>

    <script src="viewer.js"></script>
  </body>
</html>
